[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "petra"
version = "0.1.0"
description = "Petra — compila tareas de LLM a artifacts deterministas (probabilidad difusa → código sólido)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "scikit-learn>=1.3.0",
    "requests>=2.31.0"
]

[project.scripts]
petra = "compiled_ai_router.cli:main"
compiled-ai-router = "compiled_ai_router.cli:main"
